# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Checks run on pull requests; deploy is skipped for them
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only token by default. Only the deploy job gets the Pages permissions,
# so pull request checks that run branch code cannot deploy.
permissions:
  contents: read

jobs:
  # Validate the app-link association files and the page scripts (DESIGN.md 6.5)
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check association files
        run: python3 scripts/check_well_known.py
      - name: JSON validity
        run: |
          python3 -m json.tool .well-known/apple-app-site-association > /dev/null
          python3 -m json.tool apple-app-site-association > /dev/null
          python3 -m json.tool .well-known/assetlinks.json > /dev/null
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          node --test tests/redirect.test.js

  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # The group is on this job only, so pull request checks never cancel a pending deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Check that the artifact contains .well-known
        run: python3 scripts/check_well_known.py . --artifact "$RUNNER_TEMP/artifact.tar"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
